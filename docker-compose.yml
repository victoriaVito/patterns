version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: candy_patterns_db
    environment:
      POSTGRES_USER: candy_user
      POSTGRES_PASSWORD: candy_pass
      POSTGRES_DB: candy_patterns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
